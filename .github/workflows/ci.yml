name: CI y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: furbuddy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sin-respaldo-wpress:
    name: El archivo .wpress no entra al repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rechazar el respaldo .wpress
        run: |
          set -eu
          found=$(git ls-files | grep -E '\.wpress$' || true)
          if [ -n "$found" ]; then
            echo "El respaldo .wpress no se sube. Vive en /root/BackNo en la VPS:"
            echo "$found"
            exit 1
          fi

  api:
    name: API Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar la API
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

  web:
    name: Frontend Vue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Probar el frontend
        run: |
          npm ci
          npm test

  desplegar:
    name: Desplegar en la VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sin-respaldo-wpress, api, web]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar Vue y Python
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -eu
            cd /root/Furbuddy
            if [ -z "${{ secrets.FURBUDDY_GIT_TOKEN }}" ]; then
              echo "Falta el secreto FURBUDDY_GIT_TOKEN"
              exit 1
            fi
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch "https://x-access-token:${{ secrets.FURBUDDY_GIT_TOKEN }}@github.com/JuanLuis2002/Furbuddy.git" +main:refs/remotes/origin/main
            git reset --hard origin/main
            docker compose up -d --build
