name: furbuddy-app

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8092:8000"
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - app

networks:
  app:
    name: furbuddy_app
