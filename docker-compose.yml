name: furbuddy-app

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8092:8000"
    environment:
      WOOCOMMERCE_URL: ${WOOCOMMERCE_URL:-https://furbuddy.xyz}
      WOOCOMMERCE_KEY: ${WOOCOMMERCE_KEY:-}
      WOOCOMMERCE_SECRET: ${WOOCOMMERCE_SECRET:-}
      FURBUDDY_SESION_SECRETO: ${FURBUDDY_SESION_SECRETO:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - app

networks:
  app:
    name: furbuddy_app
